; Cp2077Coop settings. Copy to red4ext/plugins/Cp2077Coop/coop.ini and edit.
; The build installs this file as coop.ini.example so your own settings are never overwritten.

[player]
; Name shown to other players. Dev instances get " 2", " 3"... appended automatically.
name=V

[network]
; UDP port used when hosting (forward it on your router, or use a VPN such as Tailscale).
port=27077
; Test impairment applied to this game process: none, lan, good, typical, bad, awful
impairment=none

[dev]
; Accept the headless test tools (coop-sim) as players.
allowSimClients=true
; More detailed log in red4ext/logs.
verbose=false

[time]
; Sandevistan/Kerenzikov time fields slow your game: the world slows near an activating player, you keep full
; speed during your own, and a remote activator's puppet keeps full speed. false turns this off.
applyToGame=true

[puppet]
; How remote players are shown (docs/01-architecture.md section 4).
; drive=direct: the game's third-person V with its AI off, placed every frame at the other player's position and
;   facing, animated by the inputs captured from their V. A puppet whose body doesn't follow the placements falls
;   back to AI walking by itself (the dev panel says so).
; drive=ai: AI move commands towards the other player's position (more delay; the M0b way).
drive=direct
; How a body is placed (direct drive): auto tries transform (Codeware SetWorldTransform, AI off), then aiteleport
; (an AI teleport command, AI on), then teleport (the teleportation facility, which moves cars and V but didn't move
; NPCs in round F), then gives up and walks. Or set one of them. The dev panel's placement test shows which works.
place=auto
; Component classes switched off together with the AI in direct drive, comma-separated. Round H: teleport and
; transform only move a body with its movement component (moveComponent) off.
switchOff=moveComponent
; Record used for puppets (TweakDB names), picked by YOUR V's body, because only the one matching your V spawns.
; Default: Character.TPP_Player_Cutscene_Male / _Female. They look like YOUR V for now (per-player looks are open).
; Round I: Character.TPP_Player uses V's own animation graph and animates with the captured inputs, but shows
; only a neck, probably because V's head, body, hair and clothes come with items in attachment slots, which a
; spawned body doesn't have (round J). The dev panel's mirror can put your V's items on it (round K). To try it:
; recordMale=Character.TPP_Player
; recordFemale=Character.TPP_Player
; The plain NPC body of M0b animates under AI walking (use it with drive=ai):
; recordMale=Cp2077Coop.Character.RemotePlayer
; recordFemale=Cp2077Coop.Character.RemotePlayer
; Bodies are prepared while they are built (needs Codeware): addImpostor gives a player body (TPP_Player and the
; like) without an impostor one (round J: no visible effect, so off). (useVGraph is gone: V's graph on an NPC body
; crashed the game, round L.)
addImpostor=false
; Lend an NPC body (the cutscene lookalike) your V's gameplay animation sets while it's built, in case its graph
; doesn't walk for lack of walk animations (round N; may crash, like V's graph on it did).
borrowAnimsets=false

[anim]
; Capture your V's animation inputs and send them to the others.
capture=true
; Apply the other players' animation inputs to their puppets.
apply=true
; Graph inputs fed from each puppet's movement (worked out from the position, velocity and facing that are sent
; anyway): speed in m/s, direction relative to facing in degrees (0 forward, 90 left, -90 right, 180 back),
; vertical speed in m/s, turn rate in degrees per second (left positive), moving true/false. none = not sent,
; empty = the default below; "-name" sends the value negated; "a+b" sends it to both. The defaults are the names V's graph and the
; lookalike's graph use (round I dumps, anim-graphs-*.txt); try others live in the dev panel.
; How inputs reach a puppet: events (the game's own AnimInputSetter events, default) or controller.
applyVia=events
speedInput=speed_horizontal+desired_speed_horizontal
directionInput=move_direction
verticalSpeedInput=speed_vertical
turnRateInput=rotation_speed_yaw
movingInput=
; Also send them as V's graph's own walking feature (playerLocomotion, which the player's movement sets natively;
; a placed player body has none). Round K: with only the named inputs, crouch animates but running doesn't.
movementFeature=true
; Also tell placed player bodies to animate as third person (V's graph's TPPRepresentation feature). Round M: it
; puts the player body in a T-pose, so off.
tppFeature=false
