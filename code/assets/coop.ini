; Cyberpunk 2077 co-op. Edit, save, and (re)start the game.
;
; In the game, after loading a save: hold "/" to host a session, hold "." to join one.
; In a session, hold "/" to leave it. When the host leaves, the session ends.

[coop]
; Your name, shown to the other players.
name = V

; The host and every guest need the same password. On Steam it's also how guests find the host's session,
; so pick one of your own (not "changeme").
password = changeme

; Where "Join" connects. Empty: the host's session is found through Steam by the password (host and guest on
; Steam: no address, no port forwarding). Otherwise the host's address and port:
;   Same PC: 127.0.0.1:11778
;   Same home network: the host's local IP (Windows: ipconfig), e.g. 192.168.1.20:11778
;   Over the internet without Steam: the host's public IP, with UDP port 11778 forwarded on the host's router,
;   or the host's IP in a virtual LAN you both use (Tailscale, ZeroTier, Radmin VPN).
join_address =

; Sessions between Steam users go through Steam. false: only addresses (join_address).
steam = true

; The UDP port this game hosts on for joins by address. If it's taken (another game on this PC), the next one is used.
port = 11778

; Players in a session you host, you included.
max_players = 4
