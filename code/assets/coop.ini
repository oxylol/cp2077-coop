; Cyberpunk 2077 co-op. Edit, save, and (re)start the game.
;
; In the game, after loading a save: hold "/" to host a session, hold "." to join one.
; In a session, hold "/" to leave it. When the host leaves, the session ends.

[coop]
; Your name, shown to the other players.
name = V

; The host and every guest need the same password.
password = changeme

; Where "Join" connects: the host's address and port.
;   Same PC: 127.0.0.1:11778
;   Same home network: the host's local IP (Windows: ipconfig), e.g. 192.168.1.20:11778
;   Over the internet: the host's public IP, with UDP port 11778 forwarded on the host's router,
;   or the host's IP in a virtual LAN you both use (Tailscale, ZeroTier, Radmin VPN).
join_address = 127.0.0.1:11778

; The UDP port this game hosts on. If it's taken (another game on this PC), the next one is used.
port = 11778

; Players in a session you host, you included.
max_players = 4
