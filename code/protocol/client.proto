syntax = "proto3";

package client;

import "common.proto";

message AuthenticationRequest {
    string username = 1;
    // Set only by the host's own game: the token the embedded session generated, which makes this player the host.
    string host_token = 2;
    uint64 client_protocol = 3;
    uint64 server_protocol = 4;
    // The session password (coop.ini); checked by the host.
    string password = 5;
}

message SpawnCharacterRequest {
    common.Vector3 position = 1;
    float rotation = 2;
    bool is_player = 3;
    uint64 cookie = 4;
    // TweakDBIDs of the worn items (name hash and length, TweakDBID::value & 0xFFFFFFFFFF): the game has no item
    // names outside debug builds.
    repeated uint64 equipment = 5;
    bytes ccstate = 6;
}

message MoveEntityRequest {
    bool unreliable = 1000; // This is just a tag to indicate that this message is unreliable
    uint64 id = 1;
    common.Vector3 position = 2;
    float rotation = 3;
    float speed = 4;
    common.Vector3 full_rotation = 5;
    uint64 tick = 6;
    float aim_pitch = 7; // a character's: where the player's camera looks, up or down (radians, up positive)
}

message EnterVehicleRequest {
    uint64 id = 1;
    common.Vector3 position = 2;
    float rotation = 3;
    uint64 vehicle_id = 4;
    uint64 sit_id = 5;
    uint64 remote_vehicle_id = 6;
}

message ExitVehicleRequest {
    uint64 id = 1;
}

// Sent by the host every few seconds: its time of day and weather, for the guests to follow.
message ReportWorldState {
    uint32 game_time = 1; // seconds of game time
    uint64 weather = 2;   // the weather state's name (CName hash), 0 when unknown
}

// What the others' games show on this player's character besides where it is: its stance and the weapon in its hand.
// Sent when it changes; the session keeps the latest for players who see the character later. The states are the
// player state machine's blackboard values, as the game (CharacterSync.reds) reads and applies them.
message CharacterStateRequest {
    uint64 id = 1;           // the character (SpawnCharacterResponse.id)
    uint32 locomotion = 2;   // gamePSMLocomotionStates (crouching, sliding, ...)
    uint32 upper_body = 3;   // gamePSMUpperBodyStates (aiming, reloading)
    uint32 weapon_state = 4; // gamePSMRangedWeaponStates (reloading)
    uint64 weapon = 5;       // in the right hand: TweakDBID (name hash and length), 0 for none
}

// Shots fired with the weapon in hand since the last of these.
message CharacterShotRequest {
    bool unreliable = 1000; // This is just a tag to indicate that this message is unreliable
    uint64 id = 1;
    uint32 count = 2;
}

message Protocol {
    oneof content {
        AuthenticationRequest authentication_request = 1;
        SpawnCharacterRequest spawn_character_request = 2;
        MoveEntityRequest move_entity_request = 3;
        EnterVehicleRequest enter_vehicle_request = 6;
        ExitVehicleRequest exit_vehicle_request = 7;
        ReportWorldState report_world_state = 8;
        CharacterStateRequest character_state_request = 9;
        CharacterShotRequest character_shot_request = 10;
    }
}