syntax = "proto3";

package client;

import "common.proto";

message AuthenticationRequest {
    string username = 1;
    // Set only by the host's own game: the token the embedded session generated, which makes this player the host.
    string host_token = 2;
    uint64 client_protocol = 3;
    uint64 server_protocol = 4;
    // The session password (coop.ini); checked by the host.
    string password = 5;
}

message SpawnCharacterRequest {
    common.Vector3 position = 1;
    float rotation = 2;
    bool is_player = 3;
    uint64 cookie = 4;
    // TweakDBIDs of the worn items (name hash and length, TweakDBID::value & 0xFFFFFFFFFF): the game has no item
    // names outside debug builds.
    repeated uint64 equipment = 5;
    bytes ccstate = 6;
}

message MoveEntityRequest {
    bool unreliable = 1000; // This is just a tag to indicate that this message is unreliable
    uint64 id = 1;
    common.Vector3 position = 2;
    float rotation = 3;
    float speed = 4;
    common.Vector3 full_rotation = 5;
    uint64 tick = 6;
}

message EnterVehicleRequest {
    uint64 id = 1;
    common.Vector3 position = 2;
    float rotation = 3;
    uint64 vehicle_id = 4;
    uint64 sit_id = 5;
    uint64 remote_vehicle_id = 6;
}

message ExitVehicleRequest {
    uint64 id = 1;
}

// Sent by the host every few seconds: its time of day and weather, for the guests to follow.
message ReportWorldState {
    uint32 game_time = 1; // seconds of game time
    uint64 weather = 2;   // the weather state's name (CName hash), 0 when unknown
}

message Protocol {
    oneof content {
        AuthenticationRequest authentication_request = 1;
        SpawnCharacterRequest spawn_character_request = 2;
        MoveEntityRequest move_entity_request = 3;
        EnterVehicleRequest enter_vehicle_request = 6;
        ExitVehicleRequest exit_vehicle_request = 7;
        ReportWorldState report_world_state = 8;
    }
}