syntax = "proto3";

package server;

import "common.proto";

message Settings {
    uint32 update_rate = 1;
}

message AuthenticationResponse {
    bool success = 1;
    string error = 2;
    Settings settings = 3;
    string host_name = 4;
}

message SpawnCharacterResponse{
    uint64 id = 1;
    uint64 cookie = 2;
}

message NotifyCharacterLoad {
    uint64 id = 1;
    common.Vector3 position = 2;
    float rotation = 3;
    bool is_player = 4;
    repeated uint64 equipment = 5; // as in SpawnCharacterRequest
    bytes ccstate = 6;
}

message NotifyVehicleLoad {
    uint64 id = 1;
    common.Vector3 position = 2;
    float rotation = 3;
    uint64 tweak_id = 4;
}

message NotifyVehicleControlAssigned {
    uint64 vehicle_id = 1;
}

message NotifyVehicleEnter {
    uint64 vehicle_id = 1;
    uint64 character_id = 2;
    uint64 sit_id = 3;
}

message NotifyVehicleExit {
    uint64 character_id = 1;
}

message NotifyEntityUnload {
    uint64 id = 1;
}

message NotifyEntityMove {
    bool unreliable = 1000; // This is just a tag to indicate that this message is unreliable
    uint64 id = 1;
    common.Vector3 position = 2;
    float rotation = 3;
    uint64 tick = 4;
    float speed = 5;
    common.Vector3 full_rotation = 6;
    float aim_pitch = 7;
}

message NotifyPlayerJoined {
    string username = 1;
}

message NotifyPlayerLeft {
    string username = 1;
}

// The host's time of day and weather (client ReportWorldState), sent to the guests.
message NotifyWorldState {
    uint32 game_time = 1;
    uint64 weather = 2;
}

// A character's stance and weapon, as its player sent them (client.CharacterStateRequest).
message NotifyCharacterState {
    uint64 id = 1;
    uint32 locomotion = 2;
    uint32 upper_body = 3;
    uint32 weapon_state = 4;
    uint64 weapon = 5;
}

// Shots from a character's weapon (client.CharacterShotRequest).
message NotifyCharacterShot {
    bool unreliable = 1000; // This is just a tag to indicate that this message is unreliable
    uint64 id = 1;
    uint32 count = 2;
}

message Protocol {
    oneof content {
        AuthenticationResponse authentication_response = 1;
        NotifyCharacterLoad notify_character_load = 2;
        NotifyEntityUnload notify_character_unload = 3;
        SpawnCharacterResponse spawn_character_response = 4;
        NotifyEntityMove notify_character_move = 5;
        NotifyVehicleLoad notify_vehicle_load = 9;
        NotifyVehicleEnter notify_vehicle_enter = 10;
        NotifyVehicleExit notify_vehicle_exit = 11;
        NotifyVehicleControlAssigned notify_vehicle_control_assigned = 12;
        NotifyPlayerJoined notify_player_joined = 13;
        NotifyPlayerLeft notify_player_left = 14;
        NotifyWorldState notify_world_state = 15;
        NotifyCharacterState notify_character_state = 16;
        NotifyCharacterShot notify_character_shot = 17;
    }
}