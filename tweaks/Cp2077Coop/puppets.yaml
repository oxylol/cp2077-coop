# Remote-player puppet record (TweakXL). See docs/01-architecture.md §4.
#
# The default puppet body for now: a plain NPC, because it walks, runs and sprints with real animations under AI
# move commands. The game's V-lookalike records look like V but only slide (spike round C), so they are opt-in
# through coop.ini:
#
#   [puppet]
#   recordMale=Character.TPP_Player_Cutscene_Male
#   recordFemale=Character.TPP_Player_Cutscene_Female
Cp2077Coop.Character.RemotePlayer:
  $base: Character.spr_animals_bouncer1_ranged1_omaha_mb
