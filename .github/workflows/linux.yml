name: Build linux

# The co-op session (code/server/native) is plain C++: it's built and tested here too. The mod itself is
# Windows-only (build windows).
on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - 'claude/**'
  # Weekly, so changes outside the repository (runner images, xmake, package recipes) show up before a push
  # does; GitHub mails the failure. Also runnable by hand from the Actions tab.
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04]
        arch: [x86_64] # x64 makes xmake 3 treat it as cross-compiling (no system packages)
        mode: [releasedbg]

    runs-on: ${{ matrix.os }}
    if: "!contains(github.event.head_commit.message, 'ci skip')"

    steps:
    - uses: actions/checkout@v4

    # The PowerShell scripts (release zip, environment check, local test) parse; the runner has pwsh.
    - name: 'Check PowerShell scripts'
      run: pwsh -NoProfile -File tools/check/check-scripts.ps1

    - name: 'Update apt repositories'
      run: sudo apt-get update

    # Install xmake
    - name: 'Setup xmake'
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: 3.1.1 # as the Windows build and set_xmakever in xmake.lua; not a moving branch

    # Update xmake repository (in order to have the file that will be cached)
    - name: 'Update xmake repository'
      run: xmake repo --update

    - name: 'Configure xmake and install dependencies'
      run: timeout 30m xmake config --arch=${{ matrix.arch }} --mode=${{ matrix.mode }} --yes

    # One version of each library, no installed library built against other versions (tools/check/check_deps.lua)
    - name: 'Check resolved packages'
      run: xmake check-deps

    - name: Build
      run: xmake build -y Session.Tests

    - name: 'Session tests'
      run: xmake run Session.Tests
