name: 'Build windows'

on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - 'claude/**'
    # A tag v<version> (e.g. v0.2.0) publishes the zip as a GitHub release.
    tags:
      - 'v*'
  # Weekly, so changes outside the repository (runner images, xmake, package recipes) show up before a push
  # does; GitHub mails the failure. Also runnable by hand from the Actions tab.
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        # windows-latest moved to an image with Visual Studio 2026 and windows-2025 only has Windows
        # SDK 10.0.26100 (too new for this build). windows-2022 has VS 2022 and SDK 10.0.19041.
        os: [windows-2022]
        arch: [x64]
        # What players get (tools/package/make-release.ps1). Development builds (releasedbg) differ only in where the
        # game finds the scripts, tweaks and archives.
        mode: [release]

    runs-on: ${{ matrix.os }}
    if: "!contains(github.event.head_commit.message, 'ci skip')"
    permissions:
      contents: write # the GitHub release on tags

    steps:
      - uses: actions/checkout@v4

      - name: 'Checkout submodules'
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --force --recursive --depth=1

      - name: 'Cache xmake dependencies'
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/.xmake/packages
          key: ${{ runner.os }}-xmake-packages-${{ hashFiles('**/xmake.lua') }}
          restore-keys: |
            ${{ runner.os }}-xmake-packages-

      # Install xmake
      - name: 'Setup xmake'
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          # The version xmake.lua asks for (set_xmakever): the package recipes follow the newest xmake.
          xmake-version: 3.1.1 # Sync with cache key too
          actions-cache-folder: '.xmake-cache' # This doesn't cache dependencies, only xmake itself
          actions-cache-key: ${{ runner.os }}-xmake-cache-3.1.1

      # Visual Studio 2022, a Windows SDK below 10.0.26100, xmake, submodules (tools/check/check-env.ps1)
      - name: 'Check build environment'
        run: ./tools/check/check-env.ps1

      - name: 'Configure xmake and install dependencies'
        run: xmake config --arch=${{ matrix.arch }} --mode=${{ matrix.mode }} --vs_sdkver=10.0.19041.0 --yes

      # One version of each library, no installed library built against other versions (tools/check/check_deps.lua)
      - name: 'Check resolved packages'
        run: xmake check-deps

      # The mod (CyberpunkCoop.dll with the co-op session in it) and the session tests
      - name: 'Build with xmake'
        run: xmake -y

      - name: 'Session tests'
        run: xmake run Session.Tests

      # The zip players extract into the game folder: the mod and its requirements (tools/package/requirements.json,
      # checked against their sha256).
      - name: 'Package'
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          ./tools/package/make-release.ps1 -Version $version
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV

      # Downloading this artifact gives the zip's contents in a zip: extract it into the game folder.
      - name: 'Upload the package'
        uses: actions/upload-artifact@v4
        with:
          name: CyberpunkCoop-${{ env.PACKAGE_VERSION }}
          path: build/package/stage/

      # For crash dumps
      - name: 'Upload the symbols'
        uses: actions/upload-artifact@v4
        with:
          name: CyberpunkCoop-${{ env.PACKAGE_VERSION }}-pdb
          path: build/windows/x64/release/CyberpunkCoop.pdb
          if-no-files-found: warn

      - name: 'GitHub release'
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" "build/package/CyberpunkCoop-$env:PACKAGE_VERSION.zip" --title "Cyberpunk Coop $env:PACKAGE_VERSION" --generate-notes
