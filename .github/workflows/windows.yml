name: 'Build windows'

on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - 'claude/**'
  # Weekly, so changes outside the repository (runner images, xmake, package recipes) show up before a push
  # does; GitHub mails the failure. Also runnable by hand from the Actions tab.
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        # windows-latest moved to an image with Visual Studio 2026, which xmake 2.9.6 doesn't find, and
        # windows-2025 only has Windows SDK 10.0.26100 (too new for this build). windows-2022 has
        # VS 2022 and SDK 10.0.19041.
        os: [windows-2022]
        arch: [x64]
        mode: [releasedbg]

    runs-on: ${{ matrix.os }}
    if: "!contains(github.event.head_commit.message, 'ci skip')"

    steps:
      - uses: actions/checkout@v4

      - name: 'Checkout submodules'
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --force --recursive --depth=1

      - name: 'Cache xmake dependencies'
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/.xmake/packages
          key: ${{ runner.os }}-xmake-packages-${{ hashFiles('**/xmake.lua') }}
          restore-keys: |
            ${{ runner.os }}-xmake-packages-

      # Install xmake
      - name: 'Setup xmake'
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          # 2.9.6 turns MSVC 14.43+ (the runner's VS 2022 17.14 has 14.44) into the nonexistent CMake
          # toolset v144; 2.9.9 maps 14.40-14.49 to v143.
          xmake-version: 2.9.9 # Sync with cache key too
          actions-cache-folder: '.xmake-cache' # This doesn't cache dependencies, only xmake itself
          actions-cache-key: ${{ runner.os }}-xmake-cache-2.9.9

      # Visual Studio 2022, a Windows SDK below 10.0.26100, xmake, submodules (tools/check/check-env.ps1)
      - name: 'Check build environment'
        run: ./tools/check/check-env.ps1

      - name: 'Configure xmake and install dependencies'
        run: xmake config --arch=${{ matrix.arch }} --mode=${{ matrix.mode }} --vs_sdkver=10.0.19041.0 --yes

      # One version of each library, no installed library built against other versions (tools/check/check_deps.lua)
      - name: 'Check resolved packages'
        run: xmake check-deps

      # The mod (CyberpunkCoop.dll with the co-op session in it) and the session tests
      - name: 'Build with xmake'
        run: xmake -y

      - name: 'Session tests'
        run: xmake run Session.Tests
