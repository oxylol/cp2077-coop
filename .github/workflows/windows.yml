name: 'Build windows'

on:
  pull_request:
  push:
    branches:
      - main
      - dev

# NOTE: pnpm doesn't support command 'ci' for now.
#
#env:
#  IS_CI: true

jobs:
  build:
    strategy:
      matrix:
        # windows-latest moved to an image with Visual Studio 2026, which xmake 2.9.6 doesn't find, and
        # windows-2025 only has Windows SDK 10.0.26100 (too new for this build). windows-2022 has
        # VS 2022 and SDK 10.0.19041.
        os: [windows-2022]
        arch: [x64]
        mode: [releasedbg]

    runs-on: ${{ matrix.os }}
    if: "!contains(github.event.head_commit.message, 'ci skip')"

    steps:
      - uses: actions/checkout@v4

      - name: 'Checkout submodules'
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --force --recursive --depth=1

      - name: 'Cache xmake dependencies'
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/.xmake/packages
          key: ${{ runner.os }}-xmake-packages-${{ hashFiles('**/xmake.lua') }}
          restore-keys: |
            ${{ runner.os }}-xmake-packages-

      # Install pnpm for better disk/cache performance
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # Fix long path issue
      - name: Setup pnpm
        run: pnpm config set virtual-store-dir-max-length=50

      # Install xmake
      - name: 'Setup xmake'
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          # 2.9.6 turns MSVC 14.43+ (the runner's VS 2022 17.14 has 14.44) into the nonexistent CMake
          # toolset v144; 2.9.9 maps 14.40-14.49 to v143.
          xmake-version: 2.9.9 # Sync with cache key too
          actions-cache-folder: '.xmake-cache' # This doesn't cache dependencies, only xmake itself
          actions-cache-key: ${{ runner.os }}-xmake-cache-2.9.9

      - name: 'Configure xmake and install dependencies'
        run: xmake config --arch=${{ matrix.arch }} --mode=${{ matrix.mode }} --vs_sdkver=10.0.19041.0 --yes

      # Build the game
      - name: 'Build with xmake'
        run: xmake -y

      # Install node
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: |
            code/launcher/pnpm-lock.yaml
            code/launcher/electron/pnpm-lock.yaml

      - name: 'Generate build'
        run: xmake install -o distrib

      - name: 'Package build'
        run: xmake pack

      - name: 'Upload Artifact'
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/xpack/Cyberpunk Multiplayer/Artifacts.zip
